<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas des religions abrahamiques</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#071312;color:#fff;min-height:100vh}.glow{position:fixed;inset:0 0 auto;height:280px;background:radial-gradient(circle at top,#1e5c4d 0,transparent 70%);pointer-events:none}.wrap{position:relative;max-width:900px;margin:auto;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));min-height:100vh}.hero{text-align:center;padding-top:18px}.icon{width:52px;height:52px;margin:auto;border:1px solid #f6d88933;background:#f6cf6420;border-radius:16px;display:grid;place-items:center;font-size:25px}.eyebrow{margin-top:16px;color:#f6cf64;font-weight:800;font-size:11px;letter-spacing:.2em;text-transform:uppercase}h1{max-width:760px;margin:8px auto 0;font-size:clamp(2rem,9vw,4.5rem);line-height:.98;letter-spacing:-.04em}p{color:#cbd5e1}.panel{max-width:560px;margin:32px auto 0}.label{font-size:12px;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px 4px}select{width:100%;min-height:60px;border-radius:16px;border:1px solid #ffffff1a;background:#152523;color:#fff;padding:0 16px;font-size:16px}.card{margin-top:16px;border:1px solid #ffffff1a;background:linear-gradient(135deg,#ffffff17,#ffffff08);border-radius:24px;padding:24px}.flag{font-size:40px}.card h2{font-size:28px;margin:14px 0 5px}.card p{margin:0}.open{display:flex;min-height:58px;margin-top:24px;align-items:center;justify-content:center;text-decoration:none;background:#f6cf64;color:#10201e;border-radius:16px;font-weight:800}.quick{max-width:560px;margin:20px auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button{min-height:62px;border-radius:16px;border:1px solid #ffffff14;background:#ffffff0a;color:#94a3b8;font-weight:800;cursor:pointer}.quick button.active{border-color:#f6cf6488;background:#f6cf641f;color:#fde7a3}.quick .f{display:block;font-size:22px;margin-bottom:3px}footer{text-align:center;color:#64748b;font-size:11px;padding-top:28px}@media(min-width:640px){.quick{grid-template-columns:repeat(7,1fr)}}
</style>
</head><body><div class="glow"></div><main class="wrap"><header class="hero"><div class="icon">🌐</div><div class="eyebrow">Atlas multilingue</div><h1>Atlas des religions abrahamiques</h1><p>Explorez l’Atlas dans la langue de votre choix.</p></header><section class="panel"><div class="label">Langue</div><select id="lang"></select><div class="card" id="card"><div class="flag" id="flag"></div><h2 id="title"></h2><p id="name"></p><a class="open" id="open">Ouvrir l’Atlas&nbsp; →</a></div></section><section class="quick" id="quick"></section><footer>7 langues · Un seul Atlas</footer></main>
<script>
const langs=[
{code:'fr',flag:'🇫🇷',name:'Français',title:'Atlas des religions abrahamiques',url:'./fr/'},
{code:'en',flag:'🇬🇧',name:'English',title:'Atlas of Abrahamic Religions',url:'./en/'},
{code:'ar',flag:'🇸🇦',name:'العربية',title:'أطلس الأديان الإبراهيمية',url:'./ar/',rtl:true},
{code:'he',flag:'🇮🇱',name:'עברית',title:'אטלס הדתות האברהמיות',url:'./he/',rtl:true},
{code:'es',flag:'🇪🇸',name:'Español',title:'Atlas de las religiones abrahámicas',url:'./es/'},
{code:'pt',flag:'🇵🇹',name:'Português',title:'Atlas das religiões abraâmicas',url:'./pt/'},
{code:'zh',flag:'🇨🇳',name:'中文',title:'亚伯拉罕诸教图集',url:'./zh/'}];
const sel=document.getElementById('lang'),q=document.getElementById('quick');langs.forEach(l=>{let o=document.createElement('option');o.value=l.code;o.textContent=`${l.flag} ${l.name} · ${l.code.toUpperCase()}`;sel.appendChild(o);let b=document.createElement('button');b.dataset.code=l.code;b.innerHTML=`<span class="f">${l.flag}</span>${l.code.toUpperCase()}`;b.onclick=()=>{sel.value=l.code;render()};q.appendChild(b)});
function render(){let l=langs.find(x=>x.code===sel.value)||langs[0];document.getElementById('flag').textContent=l.flag;document.getElementById('title').textContent=l.title;document.getElementById('name').textContent=l.name;document.getElementById('open').href=l.url;document.getElementById('card').dir=l.rtl?'rtl':'ltr';document.querySelectorAll('.quick button').forEach(b=>b.classList.toggle('active',b.dataset.code===l.code))}sel.onchange=render;render();
</script></body></html>
